<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Foam Roller Reset</title>
  <desc id="desc">Couverture du programme de récupération corps complet CoAI.</desc>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505" stop-opacity=".96"/>
      <stop offset=".48" stop-color="#050505" stop-opacity=".46"/>
      <stop offset=".72" stop-color="#050505" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e6c4"/>
      <stop offset=".45" stop-color="#c9a262"/>
      <stop offset="1" stop-color="#8a6a3a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".65"/></filter>
  </defs>
  <image href="foam-roller-reset-couverture-base.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1672" height="941" fill="url(#veil)"/>
  <g transform="translate(104 136)" filter="url(#shadow)">
    <text x="0" y="0" fill="#c9a262" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="7">PROGRAMME RÉCUPÉRATION</text>
    <text x="0" y="102" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="800" letter-spacing="-3">FOAM ROLLER</text>
    <text x="0" y="196" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="800" letter-spacing="4">RESET</text>
    <rect x="0" y="238" width="106" height="4" rx="2" fill="#c9a262"/>
    <text x="0" y="305" fill="#f6f2eb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600">Déverrouille ton corps.</text>
    <text x="0" y="348" fill="#f6f2eb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600">Récupère mieux. Reviens plus fort.</text>
    <text x="0" y="425" fill="#d0cbc3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="2">8 PROTOCOLES  ·  10–15 MIN  ·  CORPS COMPLET</text>
  </g>
  <g transform="translate(1501 769)">
    <circle cx="60" cy="60" r="57" fill="#080808" fill-opacity=".68" stroke="#c9a262" stroke-opacity=".5" stroke-width="2"/>
    <image href="../../../brand/coai-mark.svg" x="10" y="10" width="100" height="100"/>
  </g>
</svg>
