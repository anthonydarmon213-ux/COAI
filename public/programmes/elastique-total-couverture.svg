<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Élastique Total</title>
  <desc id="desc">Couverture du programme Spécial élastique CoAI avec Anthony en séance.</desc>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505" stop-opacity=".98"/>
      <stop offset=".47" stop-color="#050505" stop-opacity=".82"/>
      <stop offset=".68" stop-color="#050505" stop-opacity=".18"/>
      <stop offset="1" stop-color="#050505" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e6c4"/>
      <stop offset=".45" stop-color="#c9a262"/>
      <stop offset="1" stop-color="#8a6a3a"/>
    </linearGradient>
    <linearGradient id="subjectFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".18" stop-color="white" stop-opacity=".75"/>
      <stop offset=".3" stop-color="white"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="subjectMask">
      <rect width="1672" height="941" fill="url(#subjectFade)"/>
    </mask>
    <filter id="backgroundBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".7"/></filter>
  </defs>

  <image href="elastique-total-couverture-base.png" x="0" y="-1014" width="1672" height="2971" preserveAspectRatio="none" filter="url(#backgroundBlur)"/>
  <rect width="1672" height="941" fill="#050505" opacity=".34"/>
  <g mask="url(#subjectMask)">
    <image href="elastique-total-couverture-base.png" x="616" y="-570" width="1060" height="1883" preserveAspectRatio="none"/>
  </g>
  <rect width="1672" height="941" fill="url(#veil)"/>

  <g transform="translate(104 136)" filter="url(#shadow)">
    <text x="0" y="0" fill="#c9a262" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="7">PROGRAMME ÉLASTIQUE</text>
    <text x="0" y="102" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="800" letter-spacing="-3">ÉLASTIQUE</text>
    <text x="0" y="196" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="800" letter-spacing="4">TOTAL</text>
    <rect x="0" y="238" width="106" height="4" rx="2" fill="#c9a262"/>
    <text x="0" y="305" fill="#f6f2eb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600">Un élastique. Zéro salle.</text>
    <text x="0" y="348" fill="#f6f2eb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600">Tout le corps.</text>
  </g>

  <g transform="translate(1501 769)">
    <circle cx="60" cy="60" r="57" fill="#080808" fill-opacity=".68" stroke="#c9a262" stroke-opacity=".5" stroke-width="2"/>
    <image href="../brand/coai-mark.svg" x="10" y="10" width="100" height="100"/>
  </g>
</svg>
